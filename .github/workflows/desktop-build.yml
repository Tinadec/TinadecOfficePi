name: Desktop builds

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            script: dist:win
            artifact: TinadecOffice-windows-x64
            paths: |
              apps/desktop/release/*-setup.exe
              apps/desktop/release/*-win-x64.zip
          - name: macOS x64
            os: macos-15-intel
            script: dist:mac
            artifact: TinadecOffice-macos-x64
            paths: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
          - name: Linux x64
            os: ubuntu-latest
            script: dist:linux
            artifact: TinadecOffice-linux-x64
            paths: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      WINDOWS_SIGNING_CONFIGURED: ${{ secrets.WIN_CSC_LINK != '' && secrets.WIN_CSC_KEY_PASSWORD != '' }}
      MACOS_SIGNING_CONFIGURED: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enforce Windows release signing policy
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:WINDOWS_SIGNING_CONFIGURED -ne 'true') {
            throw 'Tag builds require the standard electron-builder WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD secrets.'
          }

      - name: Enforce macOS release signing policy
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        shell: bash
        run: |
          if [[ "$MACOS_SIGNING_CONFIGURED" != "true" ]]; then
            echo "Tag builds require the standard electron-builder CSC_LINK and CSC_KEY_PASSWORD secrets." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Linux native build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: Install dependencies
        run: npm ci

      # package-lock was generated on Windows; rollup optional natives are platform-specific.
      - name: Repair rollup native binary
        shell: bash
        run: |
          PKG=$(node -p "({darwin:{x64:'@rollup/rollup-darwin-x64',arm64:'@rollup/rollup-darwin-arm64'},linux:{x64:'@rollup/rollup-linux-x64-gnu',arm64:'@rollup/rollup-linux-arm64-gnu'},win32:{x64:'@rollup/rollup-win32-x64-msvc'}})[process.platform][process.arch]")
          npm install --no-save "$PKG"

      - name: Test desktop
        run: npm test -w @tinadec/desktop

      - name: Build package
        if: runner.os != 'macOS' || !startsWith(github.ref, 'refs/tags/')
        env:
          WIN_CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: npm run ${{ matrix.script }} -w @tinadec/desktop

      # package.json intentionally disables macOS identity discovery for ordinary builds.
      - name: Build signed macOS package
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run ${{ matrix.script }} -w @tinadec/desktop -- --config.mac.identity=

      - name: Verify packaged output
        run: node apps/desktop/scripts/verify-package-output.mjs

      - name: Smoke test packaged Windows app
        if: runner.os == 'Windows'
        run: node apps/desktop/scripts/smoke-packaged-windows.mjs

      - name: Verify Windows package signatures
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows' && env.WINDOWS_SIGNING_CONFIGURED == 'true'
        shell: pwsh
        run: |
          $release = Resolve-Path 'apps/desktop/release'
          $packages = @(
            Join-Path $release 'win-unpacked/TinadecOffice.exe'
            Get-ChildItem -LiteralPath $release -File | Where-Object { $_.Name -match '-setup\.exe$' } | ForEach-Object FullName
          )
          if ($packages.Count -ne 2) {
            throw "Expected the unpacked executable and setup package; found $($packages.Count)."
          }
          foreach ($package in $packages) {
            $signature = Get-AuthenticodeSignature -LiteralPath $package
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature ($($signature.Status)): $package"
            }
            Write-Host "Valid Authenticode signature: $package [$($signature.SignerCertificate.Subject)]"
          }

      - name: Verify macOS app signature
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS' && env.MACOS_SIGNING_CONFIGURED == 'true'
        shell: bash
        run: |
          APP_PATH=$(find apps/desktop/release -maxdepth 3 -type d -name TinadecOffice.app -print -quit)
          if [[ -z "$APP_PATH" ]]; then
            echo "Packaged TinadecOffice.app was not found." >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --display --verbose=2 "$APP_PATH"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14
