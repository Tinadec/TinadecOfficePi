name: Desktop builds

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            script: dist:win
            artifact: TinadecOffice-windows-x64
            paths: |
              apps/desktop/release/*-setup.exe
              apps/desktop/release/*-portable.exe
          - name: macOS x64
            os: macos-15-intel
            script: dist:mac
            artifact: TinadecOffice-macos-x64
            paths: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
          - name: Linux x64
            os: ubuntu-latest
            script: dist:linux
            artifact: TinadecOffice-linux-x64
            paths: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Linux native build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: Install dependencies
        run: npm ci

      # package-lock was generated on Windows; rollup optional natives are platform-specific.
      - name: Repair rollup native binary
        shell: bash
        run: |
          PKG=$(node -p "({darwin:{x64:'@rollup/rollup-darwin-x64',arm64:'@rollup/rollup-darwin-arm64'},linux:{x64:'@rollup/rollup-linux-x64-gnu',arm64:'@rollup/rollup-linux-arm64-gnu'},win32:{x64:'@rollup/rollup-win32-x64-msvc'}})[process.platform][process.arch]")
          npm install --no-save "$PKG"

      - name: Test desktop
        run: npm test -w @tinadec/desktop

      - name: Build package
        run: npm run ${{ matrix.script }} -w @tinadec/desktop

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14
